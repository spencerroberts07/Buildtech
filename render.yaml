databases:
  - name: takeoff-db
    plan: free
    databaseName: takeoff
    user: takeoff

services:
  - type: web
    name: takeoff-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: takeoff-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false   # set this manually after the static site is deployed

  - type: web
    name: takeoff-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # set this manually to the backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
